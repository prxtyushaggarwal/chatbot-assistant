

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pratyush AI — Intelligent Gemini Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #090d16;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #1e293b;
      --bg-surface-subtle: rgba(30, 41, 59, 0.6);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(96, 165, 250, 0.5);
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

    aside {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 40;
      transition: transform 0.3s ease;
    }
    .sidebar-header { padding: 20px 18px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .brand-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
    .brand-title { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .new-chat-btn {
      margin: 16px 18px 8px; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px;
      font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .new-chat-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .sidebar-section { padding: 14px 18px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
    .select-control { width: 100%; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); padding: 9px 12px; font-size: 0.85rem; }

    .sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .ghost-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; background: transparent; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; }
    .ghost-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }

    main { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: var(--bg-main); min-width: 0; }
    header.chat-header { height: 60px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); background: rgba(9, 13, 22, 0.8); backdrop-filter: blur(12px); z-index: 10; }

    #chat-viewport { flex: 1; overflow-y: auto; padding: 24px 20px 100px; display: flex; flex-direction: column; align-items: center; }
    .chat-inner { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }

    .empty-hero { text-align: center; margin: 40px auto 20px; max-width: 650px; }
    .hero-title { font-size: 2rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .starter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; text-align: left; }
    .starter-btn { background: var(--bg-surface-subtle); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; color: var(--text-main); cursor: pointer; transition: all 0.25s; }
    .starter-btn:hover { background: var(--bg-surface-elevated); border-color: rgba(96, 165, 250, 0.4); transform: translateY(-2px); }

    .message-row { display: flex; gap: 14px; width: 100%; }
    .message-row.user { justify-content: flex-end; }
    .message-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; }
    .message-row.assistant .message-avatar { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.35); }
    .message-row.user .message-avatar { background: rgba(147, 51, 234, 0.2); order: 2; }
    .message-content { max-width: 85%; border-radius: 16px; padding: 14px 18px; font-size: 0.95rem; line-height: 1.6; word-break: break-word; }
    .message-row.user .message-content { background: #1d4ed8; color: #ffffff; border-bottom-right-radius: 4px; }
    .message-row.assistant .message-content { background: var(--bg-surface-elevated); border: 1px solid var(--border-color); color: #e2e8f0; border-bottom-left-radius: 4px; }

    .input-dock { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 20px 20px; background: linear-gradient(to top, var(--bg-main) 70%, transparent); display: flex; flex-direction: column; align-items: center; z-index: 20; }
    .input-container { width: 100%; max-width: 820px; background: var(--bg-surface-elevated); border: 1px solid var(--border-color); border-radius: 18px; display: flex; align-items: flex-end; padding: 10px 14px; gap: 10px; }
    #message-input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 0.95rem; outline: none; resize: none; max-height: 180px; min-height: 24px; }
    .action-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--primary); color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .code-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.04); padding: 6px 14px; font-size: 0.75rem; color: var(--text-muted); }
    .copy-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; }
    pre { position: relative; background: #141b2d !important; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; margin: 12px 0; overflow-x: auto; }
    pre code { font-family: 'Fira Code', monospace; font-size: 0.85rem; padding: 16px; display: block; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo"><span>🤖</span><span class="brand-title">Pratyush AI</span></div>
    </div>
    <button class="new-chat-btn" onclick="clearConversation()">+ New Chat</button>
    <div class="sidebar-section">
      <div>
        <div class="section-label">Active Model</div>
        <select id="model-select" class="select-control">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        </select>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="ghost-btn" onclick="exportChat()">📥 Export Chat</button>
      <button class="ghost-btn" style="color:#f87171;" onclick="clearConversation()">🗑️ Clear Chat</button>
    </div>
  </aside>

  <main>
    <header class="chat-header">
      <div style="font-weight:600; color:#93c5fd;">✨ gemini-2.5-flash</div>
      <div style="font-size:0.8rem; color:#34d399;">● Online</div>
    </header>

    <div id="chat-viewport">
      <div class="chat-inner" id="chat-messages">
        <div class="empty-hero" id="empty-hero">
          <div style="font-size:3rem; margin-bottom:12px;">✨</div>
          <h1 class="hero-title">How can I assist you today?</h1>
          <p style="color:var(--text-muted); margin-bottom:24px;">Ask me anything — coding, writing, research, or brainstorming.</p>
          <div class="starter-grid">
            <button class="starter-btn" onclick="triggerStarter('Write a clean Python program explaining recursion with memoization.')">
              <strong>💻 Code Recursion</strong>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Python recursion & memoization</div>
            </button>
            <button class="starter-btn" onclick="triggerStarter('Explain how Transformer self-attention mechanisms work in simple analogies.')">
              <strong>🧠 Explain AI Concepts</strong>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Transformer self-attention guide</div>
            </button>
            <button class="starter-btn" onclick="triggerStarter('Give me 5 unique, high-impact AI web project ideas for full-stack developers.')">
              <strong>💡 Brainstorm Projects</strong>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">High-impact full-stack AI ideas</div>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="input-dock">
      <div class="input-container">
        <textarea id="message-input" placeholder="Message Pratyush AI... (Enter to send, Shift+Enter for new line)" rows="1" onkeydown="handleInputKey(event)"></textarea>
        <button id="send-btn" class="action-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </main>

  <script>
    const state = { messages: [], isGenerating: false };
    const chatMessages = document.getElementById("chat-messages");
    const emptyHero = document.getElementById("empty-hero");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    function handleInputKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function clearConversation() {
      state.messages = [];
      chatMessages.innerHTML = "";
      chatMessages.appendChild(emptyHero);
      emptyHero.style.display = "block";
    }

    function triggerStarter(text) {
      messageInput.value = text;
      sendMessage();
    }

    function renderMessage(role, text) {
      if (emptyHero) emptyHero.style.display = "none";
      const row = document.createElement("div");
      row.className = `message-row ${role}`;
      const avatar = document.createElement("div");
      avatar.className = "message-avatar";
      avatar.innerText = role === "user" ? "👤" : "🤖";
      const content = document.createElement("div");
      content.className = "message-content";
      content.innerHTML = role === "user" ? text : marked.parse(text);
      row.appendChild(avatar);
      row.appendChild(content);
      chatMessages.appendChild(row);
      document.getElementById("chat-viewport").scrollTop = document.getElementById("chat-viewport").scrollHeight;
      return content;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || state.isGenerating) return;
      state.messages.push({ role: "user", content: text });
      renderMessage("user", text);
      messageInput.value = "";
      state.isGenerating = true;
      sendBtn.disabled = true;

      const botContent = renderMessage("assistant", "Thinking...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: state.messages, stream: true }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = "";
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const dataStr = line.substring(6).trim();
              if (dataStr === "[DONE]") continue;
              try {
                const parsed = JSON.parse(dataStr);
                if (parsed.text) {
                  fullReply += parsed.text;
                  botContent.innerHTML = marked.parse(fullReply);
                  addCodeCopyButtons(botContent);
                }
              } catch {}
            }
          }
        }
        state.messages.push({ role: "assistant", content: fullReply });
      } catch (err) {
        botContent.innerHTML = `<span style="color:#f87171;">⚠️ ${err.message}</span>`;
      } finally {
        state.isGenerating = false;
        sendBtn.disabled = false;
      }
    }

    function addCodeCopyButtons(container) {
      container.querySelectorAll("pre").forEach(pre => {
        if (pre.querySelector(".code-header")) return;
        const header = document.createElement("div");
        header.className = "code-header";
        header.innerHTML = `<span>Code</span><button class="copy-btn" onclick="navigator.clipboard.writeText(this.closest('pre').querySelector('code').innerText); this.innerText='Copied!';">Copy</button>`;
        pre.insertBefore(header, pre.firstChild);
      });
    }

    function exportChat() {
      if (!state.messages.length) return alert("No messages to export.");
      let md = "# Conversation with Pratyush AI\n\n";
      state.messages.forEach(m => md += `### ${m.role === 'user' ? 'User' : 'Pratyush AI'}:\n${m.content}\n\n`);
      const blob = new Blob([md], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "conversation.md";
      a.click();
    }
  </script>
</body>
</html>
